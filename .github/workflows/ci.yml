name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar Ruff (misma versión que requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Preparar entorno desde .env.example
        run: cp .env.example .env
      - name: Levantar la base de datos
        run: docker compose up -d --build --wait db
      - name: pytest
        run: docker compose run --rm api pytest
      - name: Apagar
        if: always()
        run: docker compose down -v

  contrato:
    name: contrato
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependencias del contrato (mismas versiones que requirements-dev.txt)
        run: pip install "$(grep -E '^openapi-spec-validator==' requirements-dev.txt)" "$(grep -E '^jsonschema==' requirements-dev.txt)" "$(grep -E '^pyyaml==' requirements-dev.txt)"
      - name: Validar contrato y ejemplos
        run: python scripts/validar_contrato.py
