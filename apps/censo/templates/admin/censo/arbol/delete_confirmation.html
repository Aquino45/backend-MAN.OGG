{% extends "admin/delete_confirmation.html" %}

{% block delete_confirm %}
  <p>¿Mandar a la papelera el árbol «{{ object }}»? No se borra: queda guardado y puede restaurarse.</p>
  <form method="post">{% csrf_token %}
  <div>
    <input type="hidden" name="post" value="yes">
    {% if is_popup %}<input type="hidden" name="{{ is_popup_var }}" value="1">{% endif %}
    {% if to_field %}<input type="hidden" name="{{ to_field_var }}" value="{{ to_field }}">{% endif %}
    <p>
      <label for="id_{{ campo_motivo }}">Motivo (obligatorio):</label>
      <input type="text" name="{{ campo_motivo }}" id="id_{{ campo_motivo }}" size="60" required>
    </p>
    <input type="submit" value="Mandar a la papelera">
    <a href="#" class="button cancel-link">No, volver</a>
  </div>
  </form>
{% endblock %}
